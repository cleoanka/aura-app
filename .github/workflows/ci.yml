name: CI

on:
  push:
    branches: [main, a1]
  pull_request:
    branches: [main, a1]

jobs:
  test:
    name: Build & Test (macOS arm64)
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}

      - name: Install frontend deps
        run: npm ci

      - name: Soul check (constitution)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/soul_check.py

      - name: Rust format check
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Rust clippy (deny warnings)
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests (offline-safe; aura/network tests are #[ignore])
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Frontend typecheck + build
        run: npm run build

      - name: Bundle .app (release)
        # Build only the .app on CI. The .dmg step (bundle_dmg.sh) drives Finder via
        # AppleScript to lay out the disk-image window, which needs a GUI session and
        # fails on headless runners. This still verifies the full release compile +
        # .app bundling; the signed .dmg is produced locally for GitHub Releases.
        run: npm run tauri build -- --bundles app
